server:
  port: 8090
spring:
  application:
    name: trainer-workload-service
  datasource:
    driverClassName: org.h2.Driver
    password: ${h2_password}
    url: jdbc:h2:mem:trainer_workload
    username: ${h2_username}
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    mongodb:
      authentication-database: admin
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      database: trainerWorkloadDB
      port: 27017
      host: localhost
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  cloud:
    loadbalancer:
      stats:
        micrometer:
          enabled: true
  activemq:
    broker-url: tcp://localhost:61616
    user: ${activeMQ_user}
    password: ${activeMQ_password}


management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0



logging:
  level:
    com:
      example: debug
      hibernate:
        resource: error
      springframework:
        security: debug
    root: info


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true