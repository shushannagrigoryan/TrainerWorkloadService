server:
  port: 8090
spring:
  application:
    name: trainer-workload-service
  data:
    mongodb:
      authentication-database: admin
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      database: trainerWorkloadDB
      port: 27017
      host: localhost
      auto-index-creation: true
  cloud:
    loadbalancer:
      stats:
        micrometer:
          enabled: true
  activemq:
    broker-url: tcp://localhost:61616
    user: ${activeMQ_user}
    password: ${activeMQ_password}


management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0



logging:
  level:
    com:
      example: debug
      hibernate:
        resource: error
      springframework:
        security: debug
    root: info


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true